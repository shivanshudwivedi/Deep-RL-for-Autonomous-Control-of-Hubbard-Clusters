name: Numerical smoke check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-smoke.txt
      - run: python scripts/smoke_solver.py
